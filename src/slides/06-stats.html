<section data-timing="60" data-section="Results">
    <h2>Numbers that matter</h2>
    <div class="stats big-stats middle">
        <div class="stat fragment">
            <div class="label">Faster</div>
            <div class="value">3.2<span class="unit">×</span></div>
            <div class="note">than the baseline</div>
            <div class="meter"><span style="width: 80%; background: var(--accent)"></span></div>
        </div>
        <div class="stat fragment">
            <div class="label">Memory</div>
            <div class="value">12<span class="unit">MB</span></div>
            <div class="note">at peak</div>
            <div class="meter"><span style="width: 30%"></span></div>
        </div>
        <div class="stat fragment">
            <div class="label">Bugs reproduced</div>
            <div class="value">7<span class="unit">/7</span></div>
            <div class="note">every one</div>
            <div class="meter"><span style="width: 100%; background: var(--ok)"></span></div>
        </div>
    </div>
    <aside class="notes">
        <p>Stat tiles show one number each.</p>
        <p>(Click) First number.</p>
        <p>(Click) Second.</p>
        <p>(Click) Third.</p>
    </aside>
</section>
